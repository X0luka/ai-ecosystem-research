tion p{margin:5px 0}footer{color:#999;margin-top:14px}@media(max-width:620px){main{margin:5px;padding:15px 12px}.stats{gap:3px}.stats strong{font-size:23px}.stats button{font-size:12px}.bar span{width:38%}.tabs{gap:3px}.tools input{width:100%}}
</style><main><header><div><h1>全球 AI 生态研究</h1><div class="sub">__RUN__</div></div><span>本地快照</span></header><div class="stats" id="stats"></div><section><div class="line"><h2>来源覆盖情况</h2><small>按去重地址计数</small></div><div id="bars"></div></section><section class="attention"><h2 class="notice">ⓘ　需要你关注</h2><p id="alerts"></p></section><div class="tabs" id="tabs"></div><div id="intro"></div><div class="tools"><input id="q" aria-label="搜索当前列表" placeholder="搜索名称、地址或编号"><select id="f" aria-label="筛选当前列表"></select><small id="scope"></small></div><div id="list"></div><div class="pager"><button id="prev">上一页</button><small id="page"></small><button id="next">下一页</button></div><footer>__FOOT__</footer></main><script type="application/json" id="data">__DATA__</script><script>
const D=JSON.parse(document.querySelector('#data').textContent),$=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),a=(u,t)=>'<a href="'+E(u)+'" target="_blank" rel="noopener">'+E(t)+' ↗</a>',names=['平台榜单','社区与产品投稿','代码仓库','模型卡与演示','论文','发布方网站','历史周报','其他网页'],modes=['搜索返回','读取返回','访问失败','请求未结束'],tabs=['研究决策','搜索轨迹','原始证据'],counts=names.map((_,i)=>new Set(D.rows.filter(r=>r.g===i).map(r=>r.url)).size),evrow=Object.fromEntries(D.rows.flatMap(r=>r.es.map(e=>[e,r]))),defer=Object.values(D.cand).filter(c=>c.decision==='deferred').length,failed=D.rows.filter(r=>r.mode===2).length;let tab=0,group=-1,page=0;
function openTab(i,g=-1,f=''){tab=i;group=g;page=0;$('#q').value='';$('#tabs').innerHTML=tabs.map((t,j)=>'<button class="'+(i===j?'active':'')+'" data-tab="'+j+'">'+t+'</button>').join('');let opts=[['全部候选','采用','暂缓','排除','观察'],['全部操作',...modes],['全部证据','发布方自述','社区反馈','原始材料']][i];$('#f').innerHTML=opts.map((v,n)=>'<option value="'+(n?v:'')+'">'+v+'</option>').join('');$('#f').value=f;$('#intro').innerHTML=['<p>本次已登记 '+Object.keys(D.cand).length+' 个研究候选。</p>','<p>每行对应一次请求中的一个链接。重复访问保留，可追踪失败后的补采。</p>','<p>每张证据卡列出采集响应、适用范围和引用它的报告表述。</p>'][i];render()}
function render(){let q=$('#q').value.toLowerCase(),f=$('#f').value,out=[];function add(id,name,state,body,key=''){if((!f||state===f)&&[id,name,key,state].join(' ').toLowerCase().includes(q))out.push('<details class="row"><summary><small>'+E(id)+'</small>　'+E(name)+'　<small>'+E(state)+'</small></summary>'+body+'</details>')}
if(!tab)for(let [id,c] of Object.entries(D.cand))add(id,c.name,({deferred:'暂缓',selected:'采用',excluded:'排除',watch:'观察'})[c.decision]||'未知','<p>'+E(c.reason)+'</p>'+E(c.scope||'')+'<p>'+c.origin.map(k=>E(k)).join('')+'</p>',c.url);
if(tab===1)for(let r of D.rows){if(group>=0&&group!==r.g)continue;let c=D.caps[r.cap];add(r.cap,r.title||r.url,modes[r.mode],'<p>'+E(c.reason)+'</p><p>'+E(r.url)+'</p>'+E(c.parent?'前序请求 '+c.parent:'')+(c.body?a(c.body,'保存的响应'):'')+'<p>'+E(c.error)+'</p>',r.url)}
if(tab===2)for(let [id,e] of Object.entries(D.ev)){let r=evrow[id],cap=D.caps[r.cap];add(id,e.title,({official_claim:'发布方自述',community_feedback:'社区反馈',primary_artifact:'原始材料'})[e.kind],'<p>'+E(e.fact)+'</p><p>'+E(e.limit)+'</p>'+E(r.cap+' 采集操作')+(cap.body?a(cap.body,'保存的响应'):'')+'<p>'+e.cs.map(c=>E(c)).join('')+'</p>',e.src)}
let n=Math.ceil(out.length/6);page=Math.min(page,Math.max(0,n-1));$('#scope').innerHTML=(group>=0?'<button data-tab="1">'+names[group]+' ×</button>　':'')+out.length+' 条';$('#list').innerHTML=out.slice(page*6,page*6+6).join('')||'没有匹配记录';$('#page').textContent=n?(page+1)+' / '+n:'0 / 0';$('#prev').disabled=!page;$('#next').disabled=page+1>=n;}
$('#bars').innerHTML=counts.map((n,i)=>'<button class="bar" data-g="'+i+'"><span>'+names[i]+'</span><i><em style="width:'+100*n/Math.max(1,...counts)+'%"></em></i><b>'+n+'</b></button>').join('');$('#stats').innerHTML=[[new Set(D.rows.map(r=>r.url)).size,'来源地址',1],[Object.keys(D.cand).length,'研究候选',0],[Object.keys(D.ev).length,'证据卡',2],[defer,'暂缓候选',0,'暂缓']].map(([n,s,i,f])=>'<button data-tab="'+i+'" data-f="'+(f||'')+'"><strong>'+n+'</strong>'+s+'</button>').join('');$('#alerts').innerHTML='<button class="linkbtn" data-tab="1" data-f="访问失败">'+failed+' 条链接访问失败</button>可查后续请求。<button class="linkbtn" data-tab="0" data-f="暂缓">'+defer+' 个候选暂缓</button>可查处理原因。';
document.onclick=e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.g!==undefined||b.dataset.tab!==undefined){openTab(b.dataset.g!==undefined?1:+b.dataset.tab,b.dataset.g!==undefined?+b.dataset.g:-1,b.dataset.f||'');$('#tabs').scrollIntoView({block:'start'})}};$('#prev').onclick=()=>{page--;render()};$('#next').onclick=()=>{page++;render()};$('#q').oninput=$('#f').onchange=()=>{page=0;render()};openTab(0);
</script></html>
